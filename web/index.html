<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Picky</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- The image owns the full width at the top; every control is a horizontal
       row along the bottom edge. What used to be side-panel sections that are
       not part of the pick → filter → apply loop are dialogs behind these
       buttons instead — see #crop-modal, #presets-modal, #cluster-modal. -->
  <header id="app-header">
    <h1>Picky</h1>
    <!-- The label's text is a span so a batch upload can count itself down in
         place; the disabled input is what greys the label out meanwhile. -->
    <label class="upload-btn">
      <span id="upload-label">+ Add JPG</span>
      <input type="file" id="file-input" accept=".jpg,.jpeg,image/jpeg" multiple hidden>
    </label>
    <!-- Short labels: eight buttons at their old panel-width wording wrapped to
         three lines on a phone. The title carries the full description. -->
    <div id="header-tools">
      <button id="embed-btn" title="See the whole library as a 3D cloud, with similar photos near each other">Map</button>
      <button id="film-btn" title="Show a filmstrip of the library along the bottom">Film</button>
      <button id="frame-btn" title="Crop and straighten the finished image" disabled>Frame</button>
      <button id="presets-btn" title="Save and replay a chain of effects">Presets</button>
      <button id="cluster-btn" hidden title="See this posterize node's colors as a 3D plot">RGB</button>
      <button id="stats-btn" title="Images, effects, and disk usage">Stats</button>
      <a id="export-btn" hidden download title="Download this node's render as a JPG">Export</a>
      <button id="delete-btn" hidden title="Delete this image and its whole work tree">Delete</button>
    </div>
  </header>

  <main id="preview-panel">
    <div id="drop-hint">Drop JPGs anywhere, or use “Add JPG”</div>
    <div id="preview-wrap" hidden>
      <img id="preview" alt="preview" draggable="false">
      <img id="mask-overlay" hidden alt="" draggable="false">
      <svg id="crop-overlay" hidden></svg>
    </div>
    <div id="zoom-hud" hidden>scroll to zoom · drag to pan · double-click to reset</div>
  </main>

  <!-- Row order is the workflow: choose an effect, say what it applies to, see
       where you are in the tree. The filmstrip is last so toggling it on never
       reorders anything above it. -->
  <footer id="control-bar">
    <section id="effects-section">
      <div id="effect-buttons" role="group" aria-label="Effect"></div>
      <div id="effect-params"></div>
      <!-- both hidden until a feature button is lit, which is what init() leaves
           the panel in; renderEffectControls() owns them from there -->
      <span id="preview-status" hidden>rendering…</span>
      <button id="apply-btn" hidden disabled>Apply</button>
    </section>
    <section id="select-section">
      <div id="select-controls"></div>
    </section>
    <section id="tree-section">
      <div id="tree"></div>
    </section>
    <section id="film-section" hidden>
      <ul id="gallery"></ul>
    </section>
  </footer>

  <dialog id="stats-modal">
    <h2>Library</h2>
    <div id="stats-body"></div>
    <div class="modal-actions">
      <button id="stats-close-btn">Close</button>
    </div>
  </dialog>

  <!-- Opened with show(), not showModal(): framing is dragged on the preview
       image, which showModal() would make inert. See enterCropMode(). -->
  <dialog id="crop-modal">
    <h2>Frame</h2>
    <div id="crop-controls"></div>
    <div class="modal-actions">
      <span id="crop-status">rendering…</span>
      <button id="crop-reset-btn">Reset</button>
      <button id="crop-save-btn">Save frame</button>
      <button id="crop-close-btn">Done</button>
    </div>
  </dialog>

  <dialog id="presets-modal">
    <h2>Presets</h2>
    <button id="save-preset-btn" disabled>Save chain as preset</button>
    <ul id="preset-list"></ul>
    <div class="modal-actions">
      <button id="presets-close-btn">Close</button>
    </div>
  </dialog>

  <dialog id="cluster-modal">
    <h2>RGB clusters</h2>
    <canvas id="cluster-canvas" width="268" height="268"></canvas>
    <div class="hint">drag to rotate · double-click to pause spin</div>
    <div class="modal-actions">
      <button id="cluster-close-btn">Close</button>
    </div>
  </dialog>

  <dialog id="embed-modal">
    <div id="embed-header">
      <h2>Image map</h2>
      <input id="embed-search" type="search" placeholder="Search…" autocomplete="off"
             title="Show only the images that match a description. The first search downloads a 254 MB text model.">
      <label id="embed-match-row" hidden title="How strong a match to keep, in standard deviations above this query's mean score across the library">
        Match
        <input id="embed-match" type="range" min="0.5" max="3" step="0.1" value="1.2">
        <span id="embed-match-num">1.2</span>
      </label>
      <label id="embed-size-row" title="Shrink the thumbnails to see past them in a crowded cloud">
        Size
        <input id="embed-size" type="range" min="0.1" max="1" step="0.05" value="1">
      </label>
      <label id="embed-cluster-row" title="How many groups to find and label. Starts at a count chosen from the size of the library.">
        Groups
        <input id="embed-clusters" type="range" min="2" max="20" step="1" value="8">
        <span id="embed-cluster-count">8</span>
      </label>
      <label id="embed-orbit-row" title="Turn the cloud about the image you picked, instead of about wherever you grabbed it">
        <input id="embed-orbit" type="checkbox">
        Orbit pick
      </label>
      <select id="embed-method" title="How the 512-d embedding is flattened to 3 dimensions">
        <option value="pca">PCA</option>
        <option value="tsne">t-SNE</option>
      </select>
      <button id="embed-close-btn">Close</button>
    </div>
    <div id="embed-stage">
      <canvas id="embed-canvas"></canvas>
      <div id="embed-card" hidden>
        <img id="embed-card-img" alt="" draggable="false">
        <div id="embed-card-name"></div>
        <button id="embed-open-btn">Open</button>
      </div>
    </div>
    <div id="embed-status" class="hint"></div>
  </dialog>

  <dialog id="edit-modal">
    <h2>Edit effect</h2>
    <div id="edit-title"></div>
    <div id="edit-params"></div>
    <div id="edit-warning" class="hint"></div>
    <div class="modal-actions">
      <span id="edit-status">rendering…</span>
      <button id="edit-cancel-btn">Cancel</button>
      <button id="edit-save-btn">Save</button>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
