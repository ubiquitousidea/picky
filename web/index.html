<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Picky</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside id="gallery-panel">
    <header>
      <h1>Picky</h1>
      <label class="upload-btn">
        + Add JPG
        <input type="file" id="file-input" accept=".jpg,.jpeg,image/jpeg" hidden>
      </label>
    </header>
    <ul id="gallery"></ul>
    <footer id="gallery-footer">
      <button id="stats-btn" title="Images, effects, and disk usage">Library stats</button>
    </footer>
  </aside>

  <main id="preview-panel">
    <div id="drop-hint">Drop a JPG anywhere, or use “Add JPG”</div>
    <img id="preview" hidden alt="preview" draggable="false">
    <div id="zoom-hud" hidden>scroll to zoom · drag to pan · double-click to reset</div>
  </main>

  <aside id="side-panel">
    <section id="effects-section">
      <h2>Apply effect</h2>
      <div id="effect-buttons" role="group" aria-label="Effect"></div>
      <div id="effect-params"></div>
      <button id="preview-btn" disabled>Preview</button>
      <button id="apply-btn" disabled>Apply</button>
    </section>
    <section id="tree-section">
      <h2>Work tree</h2>
      <div id="tree"></div>
    </section>
    <section id="actions-section">
      <a id="export-btn" hidden download>Export JPG</a>
      <button id="delete-btn" hidden>Delete image</button>
    </section>
    <section id="presets-section">
      <h2>Presets</h2>
      <button id="save-preset-btn" disabled>Save chain as preset</button>
      <ul id="preset-list"></ul>
    </section>
    <section id="cluster-section" hidden>
      <h2>RGB clusters</h2>
      <canvas id="cluster-canvas" width="268" height="268"></canvas>
      <div class="hint">drag to rotate · double-click to pause spin</div>
    </section>
  </aside>

  <dialog id="stats-modal">
    <h2>Library</h2>
    <div id="stats-body"></div>
    <div class="modal-actions">
      <button id="stats-close-btn">Close</button>
    </div>
  </dialog>

  <dialog id="edit-modal">
    <h2>Edit effect</h2>
    <div id="edit-title"></div>
    <div id="edit-params"></div>
    <div id="edit-warning" class="hint"></div>
    <div class="modal-actions">
      <span id="edit-status">rendering…</span>
      <button id="edit-cancel-btn">Cancel</button>
      <button id="edit-save-btn">Save</button>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
