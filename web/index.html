<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Picky</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside id="gallery-panel">
    <header>
      <h1>Picky</h1>
      <label class="upload-btn">
        + Add JPG
        <input type="file" id="file-input" accept=".jpg,.jpeg,image/jpeg" hidden>
      </label>
    </header>
    <ul id="gallery"></ul>
  </aside>

  <main id="preview-panel">
    <div id="drop-hint">Drop a JPG anywhere, or use “Add JPG”</div>
    <img id="preview" hidden alt="preview" draggable="false">
    <div id="zoom-hud" hidden>scroll to zoom · drag to pan · double-click to reset</div>
  </main>

  <aside id="side-panel">
    <section id="effects-section">
      <h2>Apply effect</h2>
      <select id="effect-select"></select>
      <div id="effect-params"></div>
      <button id="preview-btn" disabled>Preview</button>
      <button id="apply-btn" disabled>Apply</button>
    </section>
    <section id="tree-section">
      <h2>Work tree</h2>
      <div id="tree"></div>
    </section>
    <section id="actions-section">
      <a id="export-btn" hidden download>Export JPG</a>
      <button id="delete-btn" hidden>Delete image</button>
    </section>
    <section id="cluster-section" hidden>
      <h2>RGB clusters</h2>
      <canvas id="cluster-canvas" width="268" height="268"></canvas>
      <div class="hint">drag to rotate · double-click to pause spin</div>
    </section>
  </aside>

  <script src="app.js"></script>
</body>
</html>
